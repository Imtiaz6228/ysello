name: Deploy Ysello Marketplace

on:
  workflow_run:
    workflows: ["Build and database check"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  deployments: read
  statuses: read

jobs:
  deploy-railway:
    name: Deploy to Railway
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Validate Railway deployment configuration
        shell: bash
        run: |
          if [[ -n "$RAILWAY_TOKEN" && -n "$RAILWAY_SERVICE_ID" ]]; then
            echo "Railway will be deployed with the CLI."
            exit 0
          fi

          if [[ -z "$RAILWAY_TOKEN" && -z "$RAILWAY_SERVICE_ID" ]]; then
            echo "Railway is managed by its native GitHub integration; its exact-commit deployment will be verified."
            exit 0
          fi

          echo "::error::Configure both RAILWAY_TOKEN and RAILWAY_SERVICE_ID, or remove both to use Railway's native GitHub integration."
          exit 1
      - name: Deploy to Railway
        if: ${{ env.RAILWAY_TOKEN != '' && env.RAILWAY_SERVICE_ID != '' }}
        run: npx --yes @railway/cli@latest up --service "$RAILWAY_SERVICE_ID" --detach
      - name: Verify native Railway deployment
        if: ${{ env.RAILWAY_TOKEN == '' && env.RAILWAY_SERVICE_ID == '' }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const headers = {
            Accept: "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28",
          };
          if (process.env.GITHUB_TOKEN) {
            headers.Authorization = `Bearer ${process.env.GITHUB_TOKEN}`;
          }
          const repository = process.env.GITHUB_REPOSITORY;
          const sha = process.env.DEPLOY_SHA;
          const wait = (milliseconds) =>
            new Promise((resolve) => setTimeout(resolve, milliseconds));

          for (let attempt = 1; attempt <= 36; attempt += 1) {
            const deploymentsResponse = await fetch(
              `https://api.github.com/repos/${repository}/deployments?sha=${sha}&per_page=100`,
              { headers },
            );
            if (!deploymentsResponse.ok) {
              throw new Error(
                `Could not read GitHub deployments (${deploymentsResponse.status}).`,
              );
            }

            const deployments = (await deploymentsResponse.json()).filter(
              (deployment) => deployment.creator?.login === "railway-app[bot]",
            );
            for (const deployment of deployments) {
              const statusesResponse = await fetch(deployment.statuses_url, {
                headers,
              });
              if (!statusesResponse.ok) continue;
              const statuses = await statusesResponse.json();
              if (statuses.some((status) => status.state === "success")) {
                console.log(
                  `Verified Railway deployment ${deployment.id} for ${sha}.`,
                );
                process.exit(0);
              }
            }

            console.log(
              `Waiting for Railway native deployment (${attempt}/36)...`,
            );
            await wait(10_000);
          }

          throw new Error(
            `Railway did not report a successful native deployment for ${sha} within six minutes.`,
          );
          NODE
