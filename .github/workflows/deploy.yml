name: Deploy Ysello Marketplace

on:
  workflow_run:
    workflows: ["Build and database check"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-railway:
    name: Deploy to Railway
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Deploy to Railway
        if: ${{ env.RAILWAY_TOKEN != '' && env.RAILWAY_SERVICE_ID != '' }}
        uses: bervProject/railway-deploy@v3
        with:
          service: ${{ env.RAILWAY_SERVICE_ID }}
          token: ${{ env.RAILWAY_TOKEN }}
      - name: Railway deployment is managed externally
        if: ${{ env.RAILWAY_TOKEN == '' || env.RAILWAY_SERVICE_ID == '' }}
        run: echo "Railway secrets are not configured in GitHub; skipping CLI deployment."
